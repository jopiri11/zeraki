<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Manage Students & Results</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f2f5;
      color: #1e293b;
    }
    .header {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: white;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    .nav-links a {
      color: white;
      text-decoration: none;
      margin-left: 1rem;
      background: #3b82f6;
      padding: 0.5rem 1rem;
      border-radius: 40px;
    }
    .container { max-width: 1400px; margin: 2rem auto; padding: 0 1.5rem; }
    .card {
      background: white;
      border-radius: 24px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    }
    h2 { border-left: 5px solid #3b82f6; padding-left: 1rem; margin-bottom: 1rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { padding: 0.8rem; text-align: left; border-bottom: 1px solid #e2e8f0; }
    th { background: #f1f5f9; }
    input, select, button {
      padding: 0.5rem;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
    }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
      padding: 0.5rem 1rem;
    }
    button.danger { background: #ef4444; }
    button.success { background: #10b981; }
    .edit-btn { background: #f59e0b; margin-right: 0.5rem; }
    .save-btn { background: #10b981; }
    .delete-btn { background: #ef4444; }
    .inline-edit input { width: 80px; }
    .remarks-list { max-height: 200px; overflow-y: auto; }
    .remark-item {
      background: #f8fafc;
      border-left: 4px solid #3b82f6;
      padding: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: white;
      padding: 2rem;
      border-radius: 24px;
      width: 90%;
      max-width: 500px;
    }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.3rem; font-weight: 500; }
    input, select { width: 100%; padding: 0.6rem; }
    @media (max-width: 768px) {
      th, td { font-size: 0.8rem; padding: 0.5rem; }
      .container { padding: 0 1rem; }
    }
  </style>
</head>
<body>
<div class="header">
  <h1>🔧 Admin Dashboard</h1>
  <div class="nav-links">
    <a href="student.html">Student Portal</a>
    <a href="teacher.html">Teacher Dashboard</a>
  </div>
</div>
<div class="container">
  <!-- Authentication Section (simple password) -->
  <div id="authSection" class="card">
    <h2>🔐 Admin Login</h2>
    <input type="password" id="adminPassword" placeholder="Enter admin password">
    <button id="loginAdminBtn">Login</button>
    <p style="margin-top: 0.5rem; color: #64748b;">Demo password: <strong>admin123</strong></p>
  </div>

  <!-- Admin Panel (hidden until login) -->
  <div id="adminPanel" style="display: none;">
    <div class="card">
      <h2>📚 All Students & Results</h2>
      <button id="addStudentBtn" class="success">+ Add New Student</button>
      <div style="overflow-x: auto;">
        <table id="adminStudentsTable">
          <thead>
            <tr><th>ID</th><th>Name</th><th>Class</th><th>Subjects / Scores</th><th>Actions</th></tr>
          </thead>
          <tbody id="adminStudentsBody"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h2>💬 All Parent Remarks (All Students)</h2>
      <div id="allRemarksContainer" style="max-height: 300px; overflow-y: auto;"></div>
    </div>
  </div>
</div>

<!-- Modal for adding/editing student -->
<div id="studentModal" class="modal">
  <div class="modal-content">
    <h3 id="modalTitle">Add New Student</h3>
    <div class="form-group">
      <label>Name</label>
      <input type="text" id="modalStudentName" placeholder="e.g., Esther Njeri">
    </div>
    <div class="form-group">
      <label>Class</label>
      <input type="text" id="modalStudentClass" placeholder="e.g., Grade 8 - Alpha">
    </div>
    <div class="form-group">
      <label>Subjects & Scores (format: Subject:Score, Subject:Score ...)</label>
      <textarea id="modalSubjectsScores" rows="4" placeholder="Example:&#10;Mathematics:78&#10;English:82&#10;Kiswahili:90&#10;Science:67&#10;Social Studies:71"></textarea>
      <small>Each subject on new line, format Subject:Score</small>
    </div>
    <button id="modalSaveBtn" class="success">Save</button>
    <button id="modalCancelBtn" style="background: #6c757d;">Cancel</button>
  </div>
</div>

<script>
  // ---------- DEFAULT STUDENT DATA (same as before but stored in localStorage) ----------
  const defaultStudents = {
    1: { name: "Aisha Mohamed", class: "Grade 8 - Alpha", results: [
      { subject: "Mathematics", score: 84, grade: "A" },
      { subject: "English", score: 72, grade: "B" },
      { subject: "Kiswahili", score: 88, grade: "A" },
      { subject: "Science", score: 91, grade: "A" },
      { subject: "Social Studies", score: 65, grade: "C" }
    ]},
    2: { name: "Brian Omondi", class: "Grade 8 - Beta", results: [
      { subject: "Mathematics", score: 56, grade: "D" },
      { subject: "English", score: 68, grade: "C" },
      { subject: "Kiswahili", score: 71, grade: "B" },
      { subject: "Science", score: 48, grade: "E" },
      { subject: "Social Studies", score: 62, grade: "C" }
    ]},
    3: { name: "Cynthia Wanjiku", class: "Grade 8 - Alpha", results: [
      { subject: "Mathematics", score: 93, grade: "A" },
      { subject: "English", score: 89, grade: "A" },
      { subject: "Kiswahili", score: 94, grade: "A" },
      { subject: "Science", score: 97, grade: "A" },
      { subject: "Social Studies", score: 85, grade: "A" }
    ]},
    4: { name: "David Mwangi", class: "Grade 8 - Gamma", results: [
      { subject: "Mathematics", score: 45, grade: "E" },
      { subject: "English", score: 51, grade: "D" },
      { subject: "Kiswahili", score: 47, grade: "E" },
      { subject: "Science", score: 38, grade: "E" },
      { subject: "Social Studies", score: 42, grade: "E" }
    ]}
  };

  // Helper: calculate grade from score
  function calculateGrade(score) {
    if (score >= 80) return 'A';
    if (score >= 70) return 'B';
    if (score >= 60) return 'C';
    if (score >= 50) return 'D';
    return 'E';
  }

  // Load students from localStorage or initialize with defaults
  function loadStudents() {
    const stored = localStorage.getItem('admin_students_data');
    if (stored) {
      return JSON.parse(stored);
    } else {
      // Save default students to localStorage
      localStorage.setItem('admin_students_data', JSON.stringify(defaultStudents));
      return { ...defaultStudents };
    }
  }

  function saveStudents(students) {
    localStorage.setItem('admin_students_data', JSON.stringify(students));
  }

  // Get all remarks (from all students)
  function getAllRemarks() {
    const allRemarks = [];
    const students = loadStudents();
    for (const [id, student] of Object.entries(students)) {
      const remarks = localStorage.getItem(`remarks_student_${id}`);
      if (remarks) {
        const parsed = JSON.parse(remarks);
        parsed.forEach(r => {
          allRemarks.push({ studentName: student.name, studentId: id, ...r });
        });
      }
    }
    return allRemarks;
  }

  // Render admin table with inline editing capabilities
  function renderAdminTable() {
    const students = loadStudents();
    const tbody = document.getElementById('adminStudentsBody');
    tbody.innerHTML = '';
    for (const [id, student] of Object.entries(students)) {
      const row = tbody.insertRow();
      row.setAttribute('data-id', id);
      // ID column
      row.insertCell(0).innerText = id;
      // Name column (editable inline later, but simpler: show text)
      const nameCell = row.insertCell(1);
      nameCell.innerText = student.name;
      // Class column
      const classCell = row.insertCell(2);
      classCell.innerText = student.class;
      // Subjects column (show list of subject:score)
      const subjectsCell = row.insertCell(3);
      let subjectsHtml = '<div style="display: flex; flex-wrap: wrap; gap: 0.5rem;">';
      student.results.forEach((res, idx) => {
        subjectsHtml += `
          <div style="background:#f1f5f9; padding:0.2rem 0.5rem; border-radius:20px;">
            <span>${res.subject}:</span>
            <span class="score-display" data-id="${id}" data-subj-idx="${idx}">${res.score}</span>
            <button class="edit-score-btn" data-id="${id}" data-subj-idx="${idx}" style="background:#f59e0b; font-size:0.7rem; padding:0.1rem 0.4rem; margin-left:0.3rem;">✏️</button>
          </div>
        `;
      });
      subjectsHtml += '</div>';
      subjectsCell.innerHTML = subjectsHtml;
      // Actions column (delete student)
      const actionsCell = row.insertCell(4);
      actionsCell.innerHTML = `<button class="delete-student-btn" data-id="${id}" style="background:#ef4444;">🗑️ Delete</button>`;
    }
    // Attach event listeners after rendering
    attachEditScoreEvents();
    attachDeleteStudentEvents();
  }

  function attachEditScoreEvents() {
    document.querySelectorAll('.edit-score-btn').forEach(btn => {
      btn.removeEventListener('click', editScoreHandler);
      btn.addEventListener('click', editScoreHandler);
    });
  }

  function editScoreHandler(e) {
    const btn = e.currentTarget;
    const studentId = btn.getAttribute('data-id');
    const subjIdx = parseInt(btn.getAttribute('data-subj-idx'));
    const students = loadStudents();
    const student = students[studentId];
    if (!student) return;
    const oldScore = student.results[subjIdx].score;
    const newScore = prompt(`Edit score for ${student.results[subjIdx].subject}:`, oldScore);
    if (newScore !== null && !isNaN(newScore) && newScore >= 0 && newScore <= 100) {
      student.results[subjIdx].score = parseInt(newScore);
      student.results[subjIdx].grade = calculateGrade(parseInt(newScore));
      saveStudents(students);
      renderAdminTable(); // re-render
      alert('Score updated!');
    } else if (newScore !== null) {
      alert('Please enter a number between 0 and 100');
    }
  }

  function attachDeleteStudentEvents() {
    document.querySelectorAll('.delete-student-btn').forEach(btn => {
      btn.removeEventListener('click', deleteStudentHandler);
      btn.addEventListener('click', deleteStudentHandler);
    });
  }

  function deleteStudentHandler(e) {
    const studentId = e.currentTarget.getAttribute('data-id');
    if (confirm(`Are you sure you want to delete student ID ${studentId}? All their remarks will also be lost.`)) {
      const students = loadStudents();
      delete students[studentId];
      saveStudents(students);
      // Also delete remarks from localStorage
      localStorage.removeItem(`remarks_student_${studentId}`);
      renderAdminTable();
      displayAllRemarks();
    }
  }

  function displayAllRemarks() {
    const remarks = getAllRemarks();
    const container = document.getElementById('allRemarksContainer');
    if (remarks.length === 0) {
      container.innerHTML = '<p>No parent remarks yet.</p>';
      return;
    }
    container.innerHTML = remarks.map(r => `
      <div class="remark-item">
        <strong>${r.studentName}</strong> (ID: ${r.studentId})<br>
        💬 ${escapeHtml(r.text)}<br>
        <small>📅 ${r.date}</small>
      </div>
    `).join('');
  }

  function escapeHtml(str) {
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  // Add new student via modal
  function showAddStudentModal() {
    document.getElementById('modalTitle').innerText = 'Add New Student';
    document.getElementById('modalStudentName').value = '';
    document.getElementById('modalStudentClass').value = '';
    document.getElementById('modalSubjectsScores').value = '';
    document.getElementById('studentModal').style.display = 'flex';
    window.currentEditId = null;
  }

  function saveStudentFromModal() {
    const name = document.getElementById('modalStudentName').value.trim();
    const className = document.getElementById('modalStudentClass').value.trim();
    const subjectsText = document.getElementById('modalSubjectsScores').value.trim();
    if (!name || !className || !subjectsText) {
      alert('Please fill all fields.');
      return;
    }
    // Parse subjects
    const lines = subjectsText.split(/\r?\n/);
    const results = [];
    for (let line of lines) {
      if (line.includes(':')) {
        let [subject, scoreStr] = line.split(':');
        subject = subject.trim();
        const score = parseInt(scoreStr.trim());
        if (isNaN(score) || score < 0 || score > 100) {
          alert(`Invalid score for subject ${subject}. Must be 0-100.`);
          return;
        }
        results.push({ subject, score, grade: calculateGrade(score) });
      }
    }
    if (results.length === 0) {
      alert('At least one subject required.');
      return;
    }
    const students = loadStudents();
    // generate new ID (max id + 1)
    const ids = Object.keys(students).map(Number);
    const newId = ids.length > 0 ? Math.max(...ids) + 1 : 5;
    students[newId] = { name, class: className, results };
    saveStudents(students);
    renderAdminTable();
    displayAllRemarks();
    closeModal();
    alert(`Student ${name} added with ID ${newId}`);
  }

  function closeModal() {
    document.getElementById('studentModal').style.display = 'none';
  }

  // Simple auth
  document.getElementById('loginAdminBtn').addEventListener('click', () => {
    const pwd = document.getElementById('adminPassword').value;
    if (pwd === 'admin123') {
      document.getElementById('authSection').style.display = 'none';
      document.getElementById('adminPanel').style.display = 'block';
      renderAdminTable();
      displayAllRemarks();
    } else {
      alert('Wrong password. Use admin123');
    }
  });

  document.getElementById('addStudentBtn').addEventListener('click', showAddStudentModal);
  document.getElementById('modalSaveBtn').addEventListener('click', saveStudentFromModal);
  document.getElementById('modalCancelBtn').addEventListener('click', closeModal);
  window.onclick = (e) => { if (e.target === document.getElementById('studentModal')) closeModal(); };
</script>
</body>
</html>
